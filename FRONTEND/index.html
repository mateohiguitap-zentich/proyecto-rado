<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema RADO</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-card">
        <div class="row g-0 h-100">
            
            <div class="col-md-6 d-flex align-items-center">
                <div class="login-form-section w-100">
                    
                    <div class="logo-container">
                        <img src="img/logo_zentich.jpg" alt="Logo RADO">
                    </div>
                    
                    <div class="text-center">
                        <h1 class="system-title">ZENTICH SOLUCIONES</h1>
                        <p class="system-subtitle">Registro y Administración de Órdenes</p>
                    </div>

                    <h2 class="fs-6 fw-bold text-uppercase text-center mb-4" style="letter-spacing: 1px;">Inicio de sesión</h2>
                    
                    <!-- Formulario con ID para capturarlo en JavaScript -->
                    <form id="formLogin">
                        <div class="input-group-custom">
                            <i class="bi bi-person"></i>
                            <input type="text" id="loginUsuario" placeholder="Usuario" required>
                        </div>
                        
                        <div class="input-group-custom">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Contraseña" required>
                        </div>

                        <div class="button-wrapper">
                            <!-- Botón de tipo submit para enviar el formulario -->
                            <button type="submit" class="btn-acceder w-100 border-0" style="padding: 10px; border-radius: 5px; background: #004a98; color: white; font-weight: bold; cursor: pointer;">
                                ACCEDER
                            </button>
                        </div>
                    </form>

                    <!-- Alerta de error (Oculta por defecto con d-none) -->
                    <div id="alertaError" class="alert alert-danger mt-3 d-none text-center" style="font-size: 0.9rem; padding: 8px;">
                        Usuario o contraseña incorrectos.
                    </div>

                    <p class="footer-text">
                        © 2026 Sistema RADO | Medellín, Colombia <br>
                        Todos los derechos reservados.
                    </p>
                </div>
            </div>

            <div class="col-md-6 login-image-section">
                <div class="odontologos-frame">
                    <img src="img/logo_rado.png" alt="Odontólogos RADO">
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script de conexión con Spring Boot -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('formLogin').addEventListener('submit', async function(e) {
                e.preventDefault(); // Evita que la página se recargue automáticamente

                // Capturamos los valores ingresados por el usuario
                const usuarioInput = document.getElementById('loginUsuario').value.trim();
                const passwordInput = document.getElementById('loginPassword').value.trim();
                const alertaError = document.getElementById('alertaError');

                // Ocultamos la alerta de error por si estaba visible de un intento anterior
                alertaError.classList.add('d-none');

                // Armamos el paquete de datos DTO
                const loginDatos = {
                    usuario: usuarioInput,
                    password: passwordInput
                };

                try {
                    // Hacemos la petición POST al backend
                    const response = await fetch('https://proyecto-rado.onrender.com/api/usuarios/login', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(loginDatos)
                    });

                    // Evaluamos la respuesta
                    if (response.status === 200) {
                        // 1. Capturamos el objeto JSON completo que nos devuelve Java
                        const usuario = await response.json();

                        // 2. LA MAGIA: Guardamos el rol y el nombre en la memoria del navegador
                        localStorage.setItem('rado_rol', usuario.rolUsuario);
                        localStorage.setItem('rado_usuario_nombre', usuario.nombreUsuario); 

                        // 3. Redirigimos al sistema
                        window.location.href = "dashboard.html";
                        
                    } else if (response.status === 401) {
                        // 401 UNAUTHORIZED: Credenciales incorrectas
                        alertaError.classList.remove('d-none');
                    } else {
                        alert("Error inesperado en el servidor.");
                    }
                } catch (error) {
                    console.error("Error de conexión:", error);
                    alert("No se pudo conectar con el servidor. Verifique que Spring Boot esté activo.");
                }
            });
        });
    </script>
</body>
</html>
