# 1. Indicamos a Spring Boot que escuche en el puerto que Render le asigne
server.port=${PORT:8080}

# 2. Conexión a la base de datos MySQL en Aiven (Agregamos timeout para evitar cortes)
spring.datasource.url=jdbc:mysql://rado-bd-mateohiguitap-f7f5.a.aivencloud.com:13075/defaultdb?sslMode=REQUIRED&connectTimeout=30000
spring.datasource.username=avnadmin
spring.datasource.password=AVNS_ZeLwFbMSQ6P3G7Y6f9S
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
# Apagamos los logs de SQL en consola para ahorrar memoria y tiempo de procesamiento
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Optimización extrema de memoria (HikariCP) para el plan gratuito de Render
# Reducimos las conexiones simultáneas para que no se sature la RAM
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000